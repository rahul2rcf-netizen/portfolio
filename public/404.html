<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — M. Rahul</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1e8;
        color: #131311;
        font-family: 'Azeret Mono', ui-monospace, Menlo, monospace;
      }
      .card {
        border: 2px solid #131311;
        box-shadow: 8px 8px 0 #131311;
        background: #fcfaf3;
        padding: 40px;
        max-width: 460px;
        margin: 20px;
      }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 44px;
        margin: 0 0 12px;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      p {
        color: #5c594f;
        line-height: 1.6;
        margin: 0 0 22px;
        font-size: 13px;
      }
      a {
        display: inline-block;
        border: 2px solid #131311;
        background: #c9f63b;
        color: #131311;
        padding: 12px 20px;
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.1em;
        box-shadow: 4px 4px 0 #131311;
      }
    </style>
    <script>
      // GitHub Pages 404 fallback: send visitors from deep links back home.
      setTimeout(function () {
        location.replace('index.html')
      }, 1500)
    </script>
  </head>
  <body>
    <div class="card">
      <span style="font-size: 11px; letter-spacing: 0.14em; color: #8f8b7e">( ERROR 404 )</span>
      <h1>Wrong door</h1>
      <p>
        This page does not exist. Taking you back to the portfolio in a moment — or use the button if your browser
        interrupts redirects.
      </p>
      <a href="index.html">BACK TO PORTFOLIO</a>
    </div>
  </body>
</html>
